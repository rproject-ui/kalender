<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Hari Libur</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 600px; margin: 0 auto; }
        h2 { color: #3D947F; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box; }
        button { background: #3D947F; color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        button.danger { background: #e74c3c; }
        button.export { background: #e67e22; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background: #222; color: #3D947F; }
        .action-btns { display: flex; gap: 5px; }
    </style>
</head>
<body>

    <h2>Management Hari Libur</h2>

    <form id="holidayForm">
        <input type="hidden" id="editIndex" value="-1">
        <div class="form-group">
            <label>Bulan (1 - 12):</label>
            <input type="number" id="month" min="1" max="12" required>
        </div>
        <div class="form-group">
            <label>Tanggal (1 - 31):</label>
            <input type="number" id="day" min="1" max="31" required>
        </div>
        <div class="form-group">
            <label>Nama Hari Libur:</label>
            <input type="text" id="name" placeholder="Contoh: Idul Fitri" required>
        </div>
        <button type="submit" id="btnSave">Tambah Hari Libur</button>
        <button type="button" id="btnCancel" style="display:none; background:#555;" onclick="resetForm()">Batal</button>
    </form>

    <hr style="border-color:#333; margin: 20px 0;">

    <button class="export" onclick="downloadJS()">Unduh File HariLibur.js</button>
    <button onclick="resetToDefault()">Reset ke Awal</button>

    <table>
        <thead>
            <tr>
                <th>Tgl</th>
                <th>Keterangan</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="listTable"></tbody>
    </table>

    <script src="HariLibur.js"></script>
    <script>
        let list = [];

        function initData() {
            const local = localStorage.getItem('custom_holidays');
            if (local) {
                list = JSON.parse(local);
            } else if (window.holidayData) {
                list = [...window.holidayData];
            }
            renderTable();
        }

        function saveData() {
            localStorage.setItem('custom_holidays', JSON.stringify(list));
            renderTable();
        }

        function renderTable() {
            // Urutkan berdasarkan bulan lalu tanggal
            list.sort((a, b) => a.month - b.month || a.day - b.day);

            const tbody = document.getElementById('listTable');
            tbody.innerHTML = '';
            list.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.day}/${item.month}</td>
                    <td>${item.name}</td>
                    <td class="action-btns">
                        <button onclick="editData(${index})">Edit</button>
                        <button class="danger" onclick="deleteData(${index})">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('holidayForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const month = parseInt(document.getElementById('month').value);
            const day = parseInt(document.getElementById('day').value);
            const name = document.getElementById('name').value;
            const editIndex = parseInt(document.getElementById('editIndex').value);

            if (editIndex === -1) {
                list.push({ month, day, name });
            } else {
                list[editIndex] = { month, day, name };
            }

            saveData();
            resetForm();
        });

        function editData(index) {
            document.getElementById('month').value = list[index].month;
            document.getElementById('day').value = list[index].day;
            document.getElementById('name').value = list[index].name;
            document.getElementById('editIndex').value = index;
            document.getElementById('btnSave').innerText = "Simpan Perubahan";
            document.getElementById('btnCancel').style.display = "inline-block";
        }

        function deleteData(index) {
            if (confirm("Yakin hapus data ini?")) {
                list.splice(index, 1);
                saveData();
            }
        }

        function resetForm() {
            document.getElementById('month').value = '';
            document.getElementById('day').value = '';
            document.getElementById('name').value = '';
            document.getElementById('editIndex').value = '-1';
            document.getElementById('btnSave').innerText = "Tambah Hari Libur";
            document.getElementById('btnCancel').style.display = "none";
        }

        function resetToDefault() {
            if (confirm("Reset ulang data sesuai default HariLibur.js?")) {
                localStorage.removeItem('custom_holidays');
                list = [...window.holidayData];
                renderTable();
            }
        }

        function downloadJS() {
            const content = "var holidayData = " + JSON.stringify(list, null, 2) + ";";
            const blob = new Blob([content], { type: "text/javascript" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "HariLibur.js";
            a.click();
            URL.revokeObjectURL(url);
        }

        window.onload = initData;
    </script>
</body>
</html>
